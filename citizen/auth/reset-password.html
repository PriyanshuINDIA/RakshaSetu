<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121820">
  <meta name="mobile-web-app-capable" content="yes">
  <title>RakshaSetu: Reset Citizen Password</title>

  <link rel="icon" type="image/svg+xml" href="../assets/icons/app-icon.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/app.css">

  <style>
    .reset-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-app, #0F172A);
      padding: 20px;
    }
    .reset-card {
      background: var(--color-bg-card, #1E293B);
      border: 1px solid var(--color-border-subtle, #334155);
      border-radius: var(--radius-lg, 16px);
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .status-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    .status-loading {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.15);
      color: #22C55E;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
    }
    .status-warning {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .password-input-wrap {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-secondary, #94A3B8);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="reset-viewport">
    <div class="reset-card">
      <!-- Top Brand Header -->
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(56, 189, 248, 0.15); display: flex; align-items: center; justify-content: center; color: #38BDF8; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <div style="font-size: 15px; font-weight: 800; color: var(--color-text-primary, #F8FAFC);">RakshaSetu</div>
          <div style="font-size: 11px; color: var(--color-text-secondary, #94A3B8);">Citizen Password Recovery</div>
        </div>
      </div>

      <!-- State: Loading / Error / Message Display -->
      <div id="statusContainer" style="text-align: center;">
        <div id="statusIcon" class="status-icon-box status-loading">
          <div class="spinner"></div>
        </div>

        <h2 id="statusTitle" style="font-size: 19px; font-weight: 800; color: var(--color-text-primary, #F8FAFC); margin-bottom: 8px;">
          Verifying Reset Link...
        </h2>

        <p id="statusMessage" style="font-size: 13px; color: var(--color-text-secondary, #94A3B8); line-height: 1.5; margin-bottom: 20px;">
          Please wait while we validate your secure recovery session.
        </p>

        <div id="statusActionContainer" style="display: none;">
          <button id="statusActionBtn" class="btn btn-primary btn-full" style="min-height: 46px; font-size: 14px; font-weight: 700;">
            Back to Sign In
          </button>
        </div>
      </div>

      <!-- State: Password Reset Form -->
      <form id="resetPasswordForm" style="display: none;">
        <div id="accountInfoBox" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--color-border-subtle, #334155); border-radius: var(--radius-md, 8px); padding: 10px 12px; margin-bottom: 16px;">
          <div style="font-size: 11px; color: var(--color-text-secondary, #94A3B8); text-transform: uppercase; letter-spacing: 0.5px;">Account</div>
          <div id="userEmailDisplay" style="font-size: 13.5px; font-weight: 600; color: var(--color-text-primary, #F8FAFC); word-break: break-all;">--</div>
        </div>

        <div id="formAlertBanner" class="state-banner" style="display: none; margin-bottom: 14px;"></div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="newPassword" style="color: var(--color-text-primary, #F8FAFC); font-size: 13px;">New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="newPassword" class="input-field" placeholder="Minimum 6 characters" required autocomplete="new-password" minlength="6" style="padding-right: 40px;">
            <button type="button" class="password-toggle-btn" id="toggleNewPassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label" for="confirmPassword" style="color: var(--color-text-primary, #F8FAFC); font-size: 13px;">Confirm New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter your new password" required autocomplete="new-password" minlength="6" style="padding-right: 40px;">
            <button type="button" class="password-toggle-btn" id="toggleConfirmPassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitUpdateBtn" class="btn btn-primary btn-full" style="min-height: 48px; font-size: 14.5px; font-weight: 700;">
          Update Password
        </button>

        <div style="text-align: center; margin-top: 14px;">
          <a href="../index.html" style="font-size: 12.5px; color: var(--color-info, #38BDF8); text-decoration: underline;">
            Cancel and Return to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase-client.js';

    const statusContainer = document.getElementById('statusContainer');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const statusActionContainer = document.getElementById('statusActionContainer');
    const statusActionBtn = document.getElementById('statusActionBtn');

    const resetPasswordForm = document.getElementById('resetPasswordForm');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitUpdateBtn = document.getElementById('submitUpdateBtn');
    const formAlertBanner = document.getElementById('formAlertBanner');

    const toggleNewPassword = document.getElementById('toggleNewPassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

    // Password visibility toggles
    function setupPasswordToggle(btn, input) {
      if (!btn || !input) return;
      btn.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      });
    }
    setupPasswordToggle(toggleNewPassword, newPasswordInput);
    setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);

    function showStatus({ type, title, message, btnText, btnAction }) {
      statusContainer.style.display = 'block';
      resetPasswordForm.style.display = 'none';

      statusIcon.className = `status-icon-box status-${type}`;
      if (type === 'loading') {
        statusIcon.innerHTML = '<div class="spinner"></div>';
      } else if (type === 'success') {
        statusIcon.innerHTML = '✓';
      } else if (type === 'warning') {
        statusIcon.innerHTML = '⚠';
      } else {
        statusIcon.innerHTML = '✕';
      }

      statusTitle.textContent = title;
      statusMessage.textContent = message;

      if (btnText && btnAction) {
        statusActionContainer.style.display = 'block';
        statusActionBtn.textContent = btnText;
        statusActionBtn.onclick = btnAction;
      } else {
        statusActionContainer.style.display = 'none';
      }
    }

    function showFormAlert(message, type = 'error') {
      if (!formAlertBanner) return;
      if (!message) {
        formAlertBanner.style.display = 'none';
        formAlertBanner.textContent = '';
        return;
      }
      formAlertBanner.style.display = 'block';
      formAlertBanner.className = `state-banner ${type === 'success' ? 'success' : 'error'}`;
      formAlertBanner.textContent = message;
    }

    async function initResetFlow() {
      // 1. Inspect URL parameters and hash fragments for errors or code
      const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
      const hashParams = new URLSearchParams(hash);
      const searchParams = new URLSearchParams(window.location.search);

      const errorCode = hashParams.get('error_code') || searchParams.get('error_code');
      const errorDescription = hashParams.get('error_description') || searchParams.get('error_description');
      const error = hashParams.get('error') || searchParams.get('error');

      // Explicitly check for expired OTP or access denied
      if (errorCode === 'otp_expired' || error === 'access_denied' || (errorDescription && errorDescription.includes('expired'))) {
        showStatus({
          type: 'error',
          title: 'Reset Link Expired',
          message: 'This password reset link has expired. Please request a new reset link.',
          btnText: 'Request New Reset Link',
          btnAction: () => {
            window.location.href = '../index.html#forgot';
          }
        });
        return;
      }

      if (error || errorDescription) {
        showStatus({
          type: 'error',
          title: 'Invalid Recovery Link',
          message: errorDescription ? decodeURIComponent(errorDescription.replace(/\+/g, ' ')) : 'Unable to verify recovery link. Please request a new password reset.',
          btnText: 'Back to Sign In',
          btnAction: () => {
            window.location.href = '../index.html#forgot';
          }
        });
        return;
      }

      // 2. Exchange PKCE code if present in search params
      const code = searchParams.get('code');
      if (code) {
        try {
          await supabase.auth.exchangeCodeForSession(code);
        } catch (e) {
          console.warn('[RakshaSetu][Auth] Code exchange note:', e);
        }
      }

      // 3. Retrieve authenticated recovery session
      let { data: { session } } = await supabase.auth.getSession();

      // If session not immediately parsed, give onAuthStateChange a short window to process token from hash
      if (!session) {
        await new Promise(resolve => {
          const timer = setTimeout(resolve, 3000);
          const { data: { subscription } } = supabase.auth.onAuthStateChange((event, s) => {
            if (s) {
              session = s;
              clearTimeout(timer);
              subscription?.unsubscribe();
              resolve();
            }
          });
        });
      }

      if (!session || !session.user) {
        showStatus({
          type: 'warning',
          title: 'No Recovery Session Found',
          message: 'This recovery link is invalid or has already been used. Please request a new password reset link.',
          btnText: 'Request New Reset Link',
          btnAction: () => {
            window.location.href = '../index.html#forgot';
          }
        });
        return;
      }

      const user = session.user;
      console.log('[RakshaSetu][Auth] Recovery session active for:', user.email);

      // 4. Role-based isolation check: verify from profiles table using auth.uid()
      let profile = null;
      try {
        const { data: profData, error: profError } = await supabase
          .from('profiles')
          .select('id, role, full_name, email')
          .eq('id', user.id)
          .maybeSingle();

        if (!profError && profData) {
          profile = profData;
        }
      } catch (err) {
        console.warn('[RakshaSetu][Auth] Profile check warning:', err);
      }

      const role = (profile?.role || 'citizen').toLowerCase().trim();

      // Authority accounts are strictly forbidden from citizen portal password resetting
      if (role === 'authority' || role === 'admin') {
        await supabase.auth.signOut();
        showStatus({
          type: 'warning',
          title: 'Authority Account Detected',
          message: 'Authority and EOC administrative credentials cannot be updated through the Citizen Portal. Please use your authorized EOC system.',
          btnText: 'Close & Return',
          btnAction: () => {
            window.location.href = '../index.html';
          }
        });
        return;
      }

      // 5. Citizen user confirmed: Display Set New Password form
      statusContainer.style.display = 'none';
      resetPasswordForm.style.display = 'block';
      userEmailDisplay.textContent = user.email || 'Citizen Account';

      // Attach submit handler
      resetPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        showFormAlert(null);

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword || newPassword.length < 6) {
          showFormAlert('Password must be at least 6 characters long.', 'error');
          return;
        }

        if (newPassword !== confirmPassword) {
          showFormAlert('Passwords do not match. Please verify and try again.', 'error');
          return;
        }

        try {
          submitUpdateBtn.disabled = true;
          submitUpdateBtn.textContent = 'Updating Password...';

          const { error: updateError } = await supabase.auth.updateUser({
            password: newPassword
          });

          if (updateError) {
            throw updateError;
          }

          console.log('[RakshaSetu][Auth] Password updated successfully');

          // Sign out recovery session so user explicitly signs in with new password
          try {
            await supabase.auth.signOut();
          } catch (e) {}

          // Show success state
          showStatus({
            type: 'success',
            title: 'Password Updated Successfully',
            message: 'Your RakshaSetu citizen password has been updated. You can now sign in with your new credentials.',
            btnText: 'Proceed to Sign In',
            btnAction: () => {
              window.location.href = '../index.html';
            }
          });

          // Auto-redirect after 3.5 seconds
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 3500);

        } catch (err) {
          console.error('[RakshaSetu][Auth] Password update failed:', err?.message);
          submitUpdateBtn.disabled = false;
          submitUpdateBtn.textContent = 'Update Password';
          showFormAlert(err?.message || 'Failed to update password. Please try again or request a new reset link.', 'error');
        }
      });
    }

    initResetFlow();
  </script>
</body>
</html>
