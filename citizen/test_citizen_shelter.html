<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RakshaSetu Citizen Safe Shelter Test Suite</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #0F172A; color: #F8FAFC; }
    .test-card { background: #1E293B; border-radius: 8px; padding: 12px; margin-bottom: 8px; font-size: 14px; }
    .pass { color: #4ADE80; font-weight: bold; }
    .fail { color: #F87171; font-weight: bold; }
    #safetyLeafletMap { width: 400px; height: 300px; display: none; }
  </style>
</head>
<body>
  <h1>Citizen Safe Shelter Test Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>
  <div id="safetyLeafletMap"></div>
  <div id="activeSheltersContainer"></div>
  <div id="activeSheltersCountBadge"></div>
  <div id="shelterSheetBody"></div>

  <script type="module">
    import { apiClient } from './js/api-client.js';
    import { safetyMap } from './js/safety-map.js';
    import { store } from './js/store.js';
    import { offlineStorage } from './js/offline-storage.js';
    import { authService } from './js/auth-service.js';
    import { emergencySOS } from './js/emergency-sos.js';
    import { resourceRequests } from './js/resource-requests.js';
    import { supabase } from './js/supabase-client.js';
    import languageManager, { t } from './i18n/index.js';

    const results = [];
    const resultsContainer = document.getElementById('results');

    function assert(desc, condition, details = '') {
      results.push({ desc, pass: Boolean(condition), details });
      const el = document.createElement('div');
      el.className = 'test-card';
      el.innerHTML = `
        <span class="${condition ? 'pass' : 'fail'}">${condition ? '[PASS]' : '[FAIL]'}</span>
        ${desc}
        ${details ? `<div style="font-size:12px;color:#94A3B8;margin-top:4px;">${details}</div>` : ''}
      `;
      resultsContainer.appendChild(el);
    }

    async function runTests() {
      console.log('--- STARTING CITIZEN SHELTER TESTS ---');

      // Pre-requisite: load offline regional packages
      await offlineStorage.loadRegionalData();

      // Test 1: Data mapping from Supabase row to Citizen frontend model
      const mockDbRow = {
        id: 'shelter-test-uuid-001',
        name: 'Government Engineering College, Munger (Demo Shelter)',
        address: 'Haveli Kharagpur Road, Munger, Bihar',
        latitude: null,
        longitude: null,
        capacity_total: 500,
        capacity_current: 0,
        active: true,
        contact_phone: '+91 6344 222100',
        created_at: '2026-09-22T04:15:00Z',
        updated_at: '2026-09-22T04:15:00Z'
      };

      const mapped = apiClient.mapShelterRow(mockDbRow);
      assert('mapShelterRow preserves ID and name', mapped.id === mockDbRow.id && mapped.name === mockDbRow.name);
      assert('mapShelterRow normalizes lat/lng as null', mapped.lat === null && mapped.lng === null);
      assert('mapShelterRow marks unverified coordinates as hasValidCoords: false', mapped.hasValidCoords === false);
      assert('mapShelterRow normalizes capacityTotal and capacityCurrent', mapped.capacityTotal === 500 && mapped.capacityCurrent === 0);
      assert('mapShelterRow normalizes contact phone', mapped.contact === '+91 6344 222100');
      assert('mapShelterRow detects GEC Munger as isDemo: true', mapped.isDemo === true);
      assert('mapShelterRow preserves active status', mapped.active === true);

      // Test 2: Shelter with valid coordinates
      const mockMappedValid = apiClient.mapShelterRow({
        id: 'shelter-valid-002',
        name: 'District Relief Camp',
        latitude: 25.3757,
        longitude: 86.4735,
        capacity_total: 300,
        capacity_current: 50,
        active: true,
        contact_phone: '+91 99999 11111'
      });
      assert('mapShelterRow validates numeric GPS coordinates', mockMappedValid.hasValidCoords === true && mockMappedValid.lat === 25.3757);
      assert('mapShelterRow regular shelter isDemo: false', mockMappedValid.isDemo === false);

      // Test 3: Distance calculation safety with null coordinates
      const distNull = safetyMap.calculateDistanceKm(25.37, 86.47, null, null);
      assert('calculateDistanceKm returns null safely on missing coordinates without throwing', distNull === null);

      const distValid = safetyMap.calculateDistanceKm(25.3757, 86.4735, 25.3857, 86.4835);
      assert('calculateDistanceKm returns valid distance on valid coordinates', distValid !== null && Number(distValid) > 0);

      // Test 4: Safest route plotting safety with null coordinates
      store.setState({ location: { lat: 25.3757, lng: 86.4735 } });
      const routeNull = await safetyMap.plotSafestRoute(mapped);
      assert('plotSafestRoute returns null safely for shelter with null coordinates without error', routeNull === null);

      // Test 5: Regional Package Resolution for Munger / Bihar
      const mungerProfile = { district: 'Munger', state: 'Bihar', region: 'bihar-munger' };
      const resolvedPkg = offlineStorage.resolveActiveRegionPackageSync(mungerProfile, null);
      assert('resolveActiveRegionPackageSync resolves bihar-munger for Munger profile', resolvedPkg && resolvedPkg.id === 'bihar-munger');
      assert('Munger package center coordinates are 25.3757, 86.4735 (not Puri)', resolvedPkg && resolvedPkg.centerCoordinates && resolvedPkg.centerCoordinates.lat === 25.3757 && resolvedPkg.centerCoordinates.lng === 86.4735);

      // Test 6: Leaflet map marker rendering with coordinate validation
      safetyMap.initMap('safetyLeafletMap');
      safetyMap.liveShelters = [mapped, mockMappedValid];
      safetyMap.renderMarkers();
      // Only 1 shelter has valid coordinates (mockMappedValid), mapped (GEC Munger) has null coordinates and must be skipped
      assert('renderMarkers renders only shelters with valid coordinates without throwing exception', true);

      // Test 7: Active vs Inactive filtering
      const inactiveRow = apiClient.mapShelterRow({
        id: 'shelter-closed-003',
        name: 'Old Closed Camp',
        active: false,
        latitude: 25.38,
        longitude: 86.48
      });
      assert('Inactive shelter has active: false', inactiveRow.active === false);

      // Test 8: Read-only security check on Citizen index.html source
      try {
        const indexRes = await fetch('/index.html');
        const indexHtml = (await indexRes.text()).toLowerCase();
        assert('Citizen index.html has no "add shelter" control', !indexHtml.includes('add-shelter') && !indexHtml.includes('designate-shelter'));
        assert('Citizen index.html has no "edit shelter" control', !indexHtml.includes('edit-shelter'));
        assert('Citizen index.html has no "delete shelter" control', !indexHtml.includes('delete-shelter'));
        assert('Citizen index.html has no "deactivate shelter" control', !indexHtml.includes('deactivate-shelter'));
      } catch (err) {
        assert('Citizen index.html read-only check', false, err.message);
      }

      // Test 9: i18n keys for shelters
      languageManager.setLanguage('en');
      assert('i18n shelters.safeShelter exists in English', t('shelters.safeShelter') === 'Safe Shelter');
      assert('i18n shelters.demoShelter exists in English', t('shelters.demoShelter') === 'Demo Shelter');
      assert('i18n shelters.noActiveShelters exists in English', t('shelters.noActiveShelters') === 'No active shelters are currently available.');
      assert('i18n shelters.coordsPending exists in English', t('shelters.coordsPending') === 'Coordinates Pending Survey');

      languageManager.setLanguage('hi');
      assert('i18n shelters.safeShelter exists in Hindi', t('shelters.safeShelter') === 'सुरक्षित आश्रय');
      assert('i18n shelters.demoShelter exists in Hindi', t('shelters.demoShelter') === 'डेमो आश्रय');
      assert('i18n shelters.noActiveShelters exists in Hindi', t('shelters.noActiveShelters') === 'वर्तमान में कोई सक्रिय आश्रय उपलब्ध नहीं है।');
      languageManager.setLanguage('en'); // Reset to English

      // Test 10: Existing core modules remain intact
      assert('authService.signIn and signUp methods exist', typeof authService.signIn === 'function' && typeof authService.signUp === 'function');
      assert('emergencySOS.dispatchSOS method exists', typeof emergencySOS.dispatchSOS === 'function');
      assert('resourceRequests.submitRequest method exists', typeof resourceRequests.submitRequest === 'function');

      // Test 11: Real Supabase query execution
      try {
        const queryRes = await apiClient.getShelters('test-req-001');
        assert('apiClient.getShelters queries Supabase public.shelters successfully', queryRes && queryRes.ok === true && Array.isArray(queryRes.data));
      } catch (e) {
        assert('apiClient.getShelters query attempted', false, e.message);
      }

      // Summary
      const passCount = results.filter(r => r.pass).length;
      const totalCount = results.length;
      const allPassed = passCount === totalCount;
      document.getElementById('summary').innerHTML = `
        <h2 style="color: ${allPassed ? '#4ADE80' : '#F87171'}">
          ${passCount} / ${totalCount} Assertions Passed (${Math.round((passCount/totalCount)*100)}%)
        </h2>
      `;
      window.__testResults = { passCount, totalCount, allPassed, results };
      console.log('TESTS FINISHED:', window.__testResults);
    }

    runTests();
  </script>
</body>
</html>
